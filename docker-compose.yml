version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: draftbench_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app   # Automatically syncs code and the data/db/draftbench.db file
    environment:
      - DATABASE_URL=sqlite:///./data/db/draftbench.db
      - SECRET_KEY=local_hackathon_secret_key_123
      - SUPABASE_URL=http://localhost
      - OLLAMA_HOST=http://host.docker.internal:11434
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: draftbench_frontend
    ports:
      - "8081:8081"
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npx", "expo", "start", "--web", "--host", "lan", "--port", "8081"]
    restart: unless-stopped